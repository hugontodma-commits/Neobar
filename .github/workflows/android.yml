
name: Build NeoBar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile NeoBar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Cloud Build Package
        run: |
          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "No ZIP package found!"
            ls -la
            exit 1
          fi

          echo "Extracting $ZIP"
          unzip -q "$ZIP" -d source

      - name: Find Android Project
        id: project
        run: |
          SETTINGS=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            find source -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Upload NeoBar APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoBar-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
